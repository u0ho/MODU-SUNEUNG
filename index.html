<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://etszdzaxuepohcxgcwqf.supabase.co wss://etszdzaxuepohcxgcwqf.supabase.co;" />
  <title>모두의 수능</title>
  <!-- 라벨지 강조 글자용 손글씨 서체 폴백 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" />
  <link rel="stylesheet" href="./styles/board.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <div class="flip-clock" id="ddayClock" aria-label="11월 19일 00시 D-day까지 남은 시간">
        <span class="flip-title">D-day</span>
        <div class="flip-row">
          <div class="flip-unit">
            <div class="flip-pair">
              <span class="flip-digit">0</span>
              <span class="flip-digit">0</span>
            </div>
            <span class="flip-label">days</span>
          </div>
          <span class="flip-sep" aria-hidden="true"></span>
          <div class="flip-unit">
            <div class="flip-pair">
              <span class="flip-digit">0</span>
              <span class="flip-digit">0</span>
            </div>
            <span class="flip-label">hours</span>
          </div>
          <span class="flip-sep" aria-hidden="true"></span>
          <div class="flip-unit">
            <div class="flip-pair">
              <span class="flip-digit">0</span>
              <span class="flip-digit">0</span>
            </div>
            <span class="flip-label">minutes</span>
          </div>
        </div>
      </div>
      <span class="presence" id="presence">접속 중 1명</span>
    </div>
    <div class="topbar-center">
      <label class="search-label" id="searchLabelWrap" for="search">
        <span class="search-prefix">이름:</span>
        <input class="search" id="search" type="search" maxlength="12" autocomplete="off" aria-label="수험생 이름 검색" />
      </label>
      <div class="page-heading" id="pageHeading" hidden></div>
    </div>
    <div class="top-right">
      <div class="board-tools" id="boardTools">
        <div class="sort" role="group" aria-label="정렬">
          <button type="button" data-sort="latest" aria-pressed="true">최신순</button>
          <button type="button" data-sort="likes" aria-pressed="false">좋아요순</button>
        </div>
        <button type="button" class="cap-btn" id="shareLinkBtn" disabled title="이름을 검색한 뒤 전용 응원함 링크를 복사할 수 있습니다">링크 복사</button>
        <button type="button" class="cap-btn" id="capEnterBtn" disabled title="이름을 검색한 뒤 캡처할 수 있습니다">캡처</button>
        <div class="cap-actions" id="capActions" hidden>
          <button type="button" class="cap-btn primary" id="capSaveBtn" disabled>선택 캡처 (0)</button>
          <button type="button" class="cap-btn primary" id="capStoryBtn" disabled>스토리 9:16 (0)</button>
          <button type="button" class="cap-btn" id="capCancelBtn">취소</button>
        </div>
      </div>
      <div class="menu-wrap" id="menuWrap">
        <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="서비스 메뉴 열기" title="메뉴">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="6.5" x2="20" y2="6.5"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17.5" x2="20" y2="17.5"></line>
          </svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown" role="menu" aria-label="서비스 메뉴" hidden>
          <button type="button" class="menu-item" role="menuitemradio" data-page="board" aria-checked="true">모두의 응원 메세지</button>
          <button type="button" class="menu-item" role="menuitemradio" data-page="chat" aria-checked="false">실시간 채팅</button>
          <button type="button" class="menu-item" role="menuitemradio" data-page="timer" aria-checked="false">모의 타이머</button>
        </div>
      </div>
    </div>
  </header>

  <aside class="ad-banner" id="adBanner" aria-label="광고 및 응원 배너">
    <div class="ad-banner-inner">
      <span class="ad-badge">AD</span>
      <p class="ad-text">남은 기간 7일, 모든 수험생 여러분들을 응원합니다.</p>
    </div>
  </aside>

  <main class="board" id="board">
    <div class="stack" id="stack" aria-live="polite"></div>
  </main>

  <section class="page-view" id="chatPage" hidden aria-label="수능 영역별 실시간 익명채팅방">
    <div class="chat-layout">
      <aside class="room-sidebar">
        <div class="room-sidebar-head">
          <span>영역별 채팅방 (22)</span>
          <span>참여 / 정원</span>
        </div>
        <div class="room-list" id="roomList" role="listbox" aria-label="채팅방 목록"></div>
      </aside>
      <div class="chat-panel">
        <div class="chat-head">
          <div class="chat-head-left">
            <h2 class="chat-room-title" id="chatRoomTitle">전체 채팅방</h2>
            <span class="chat-room-badge" id="chatRoomCount">1 / 1,000명</span>
          </div>
          <span class="chat-nick-tag" id="chatMyNick">내 익명 이름: 수험생</span>
        </div>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input class="chat-input" id="chatInput" type="text" maxlength="300" placeholder="영역별 익명 채팅 메시지를 입력하세요 (Enter 전송)" autocomplete="off" required />
          <button type="submit" class="send">전송</button>
        </form>
      </div>
    </div>
  </section>

  <section class="page-view" id="timerPage" hidden aria-label="수능 모의 시험 시간 타이머">
    <div class="timer-layout">
      <div class="timer-container">
        <div class="timer-toolbar">
          <span class="timer-desc">타이머가 종료되면 실제 수능 시험장 타종 효과음이 울립니다. 멈춤 상태에서는 기록 버튼이 초기화 버튼으로 전환됩니다.</span>
          <div class="timer-toolbar-actions">
            <button type="button" class="cap-btn" id="testChimeBtn">🔔 수능 타종음 미리듣기</button>
            <button type="button" class="cap-btn primary" id="resetAllTimersBtn">전체 기본값 초기화</button>
          </div>
        </div>
        <div class="timer-board">
          <div class="timer-main-col" id="timerMainCol"></div>
          <div class="timer-side-col" id="timerSideCol"></div>
        </div>
      </div>
    </div>
  </section>

  <input class="scale" id="scale" type="range" min="1" max="2" step="0.05" value="1" aria-label="메시지 크기 조절" />

  <form class="composer" id="composer">
    <button type="button" class="swatch color-btn" id="colorBtn" aria-haspopup="true" aria-expanded="false" aria-label="메시지 배경 컬러 선택"></button>
    <div class="palette" id="palette" role="radiogroup" aria-label="메시지 배경 컬러" hidden></div>
    <textarea id="text" rows="1" maxlength="500" placeholder="응원 메시지를 입력하세요" autocomplete="off" required></textarea>
    <input id="pw" type="password" minlength="4" maxlength="72" placeholder="암호 4자리+" autocomplete="new-password" required aria-label="삭제용 암호 (4자리 이상)" />
    <button type="submit" class="send">전송</button>
  </form>

  <dialog class="dialog" id="viewDialog">
    <div class="dialog-body">
      <p class="dialog-text" id="viewText"></p>
      <div class="actions"><button type="button" class="btn primary" id="viewClose">닫기</button></div>
    </div>
  </dialog>

  <dialog class="dialog" id="deleteDialog">
    <form class="dialog-body" id="deleteForm">
      <p class="dialog-title">메시지를 삭제하려면 등록 시 입력한 암호를 입력하세요.</p>
      <input class="field" id="deletePw" type="password" minlength="4" maxlength="72" required autocomplete="off" aria-label="암호" />
      <p class="error" id="deleteError" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="btn" id="deleteCancel">취소</button>
        <button type="submit" class="btn primary" id="deleteSubmit">삭제</button>
      </div>
    </form>
  </dialog>

  <!-- Script map: core (config/utils/state/clock) -> capture (canvas PNG export) -> board (messages/layout/sync) -> chat (22 rooms) -> timer (7 sections) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
  <script defer src="./scripts/core.js"></script>
  <script defer src="./scripts/capture.js"></script>
  <script defer src="./scripts/board.js"></script>
  <script defer src="./scripts/chat.js"></script>
  <script defer src="./scripts/timer.js"></script>
</body>
</html>
