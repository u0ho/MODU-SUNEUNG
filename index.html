          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          const mx = bx + (mr.left - elRect.left);
          const my = by + (mr.top - elRect.top) + mr.height / 2;
          ctx.fillText(m.moreEl.textContent, mx, my);
          ctx.beginPath();
          ctx.moveTo(mx, by + (mr.bottom - elRect.top) - 2);
          ctx.lineTo(mx + mr.width, by + (mr.bottom - elRect.top) - 2);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        // 3. 감정표현 버튼들
        if (!m.reactEl.hidden) {
          for (const btn of m.reactEl.children) {
            const br = btn.getBoundingClientRect();
            const rx = bx + (br.left - elRect.left);
            const ry = by + (br.top - elRect.top);
            const rw = br.width;
            const rh = br.height;
            const bStyle = getComputedStyle(btn);

            drawRoundRect(ctx, rx, ry, rw, rh, rh / 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.strokeStyle = btn.classList.contains('on') ? ink : line;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.font = `${bStyle.fontWeight} ${bStyle.fontSize} ${bStyle.fontFamily}`;
            ctx.fillStyle = ink;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btn.textContent, rx + rw / 2, ry + rh / 2 + 0.5);
          }
        }

        // 4. 우측 하단 날짜·시간
        const timeEl = m.el.querySelector('.time');
        if (timeEl) {
          const tr = timeEl.getBoundingClientRect();
          const tStyle = getComputedStyle(timeEl);
          ctx.save();
          ctx.font = `${tStyle.fontWeight} ${tStyle.fontSize} ${tStyle.fontFamily}`;
          ctx.fillStyle = 'rgba(37, 37, 37, 0.45)';
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(timeEl.textContent, bx + (tr.right - elRect.left), by + (tr.top - elRect.top) + tr.height / 2);
          ctx.restore();
        }
      });

      // 5. 캡처 이미지 하단 '모두의 수능' 스탬프 로고 (약간 더 키운 스탬프 형태로 배치)
      if (stampLogoImg.complete && stampLogoImg.naturalWidth > 0) {
        const aspect = stampLogoImg.naturalWidth / stampLogoImg.naturalHeight;
        const stampH = isStory ? 38 : 32;
        const stampW = Math.round(stampH * aspect);
        const stampCenterX = cw / 2;
        const stampCenterY = isStory
          ? Math.min(ch - 46, Math.max(offsetY + contentH + 46, ch - 64))
          : offsetY + contentH + Math.round((ch - (offsetY + contentH)) / 2);

        ctx.save();
        ctx.translate(stampCenterX, stampCenterY);
        ctx.rotate((-1.2 * Math.PI) / 180);
        ctx.globalAlpha = 0.84;
        ctx.drawImage(stampLogoImg, -stampW / 2, -stampH / 2, stampW, stampH);
        if (pattern) {
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = pattern;
          ctx.fillRect(-stampW / 2, -stampH / 2, stampW, stampH);
        }
        ctx.restore();
      }

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const stamp = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}${pad2(now.getSeconds())}`;
        a.href = url;
        a.download = isStory ? `suneung-story-${stamp}.png` : `suneung-messages-${stamp}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setCaptureMode(false);
      }, 'image/png');
    }

    capEnterBtn.addEventListener('click', () => {
      if (!query) return;
      setCaptureMode(true);
    });
    capCancelBtn.addEventListener('click', () => setCaptureMode(false));
    capSaveBtn.addEventListener('click', () => captureSelected('pack'));
    capStoryBtn.addEventListener('click', () => captureSelected('story'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && capturing) setCaptureMode(false);
    });

    // ── 감정표현: 낙관적 반영 → 서버 확정 카운트로 교체, 실패 시 롤백 ──
    async function toggleReaction(item, key) {
      if (item.pending || !REACTION_KEYS.has(key)) return;
      const mine = new Set(reacted[item.id] || []);
      const delta = mine.has(key) ? -1 : 1;
      const prev = item.reactions;
      item.reactions = { ...prev, [key]: Math.max(0, (prev[key] || 0) + delta) };
      if (delta > 0) mine.add(key); else mine.delete(key);
      setReacted(item.id, mine);
      renderReactions(item);
      try {
        const counts = await api.react(item.id, key, delta, prev);
        if (messages.has(item.id)) {
          item.reactions = normalizeReactions(counts);
          renderReactions(item);
        }
      } catch (err) {
        if (delta > 0) mine.delete(key); else mine.add(key);
        setReacted(item.id, mine);
        if (messages.has(item.id)) { item.reactions = prev; renderReactions(item); }
        console.error('[board] 감정표현 실패', err);
      }
    }

    // ── 더보기 팝업 ──
    function openView(item) {
      viewText.textContent = item.content;
      viewDialog.style.backgroundColor = COLORS[item.color]; // 원래 박스와 같은 배경색
      viewDialog.showModal();
    }
    $('viewClose').addEventListener('click', () => viewDialog.close());

    // ── 삭제: 암호 확인 팝업 ──
    let deleteTarget = null;
    function openDelete(item) {
      if (item.pending) return;
      deleteTarget = item.id;
      deletePw.value = '';
      deleteError.hidden = true;
      deleteDialog.showModal();
      deletePw.focus();
    }
    $('deleteCancel').addEventListener('click', () => deleteDialog.close());
    deleteDialog.addEventListener('close', () => { deleteTarget = null; });

    deleteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = deleteTarget;
      if (!id) return;
      deleteSubmit.disabled = true;
      try {
        const result = await api.remove(id, deletePw.value);
        if (result === 'deleted' || result === 'not_found') {
          deleteDialog.close();
          removeMessage(id);
          return;
        }
        deleteError.textContent = result === 'locked'
          ? '암호를 여러 번 틀려 10분간 삭제할 수 없습니다.'
          : '암호가 일치하지 않습니다.';
        deleteError.hidden = false;
        deletePw.select();
      } catch (err) {
        deleteError.textContent = '삭제 중 오류가 발생했습니다. 다시 시도해 주세요.';
        deleteError.hidden = false;
        console.error('[board] 삭제 실패', err);
      } finally {
        deleteSubmit.disabled = false;
      }
    });

    // 팝업 바깥(배경) 클릭 시 닫기
    for (const dlg of [viewDialog, deleteDialog]) {
      dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
    }

    // ── 배경 컬러 선택 (마지막 선택을 브라우저에 기억) ──
    const colorBtn = $('colorBtn'), palette = $('palette');
    let currentColor = 'white';
    try { currentColor = colorOf(localStorage.getItem('board:color')); } catch {}

    function setColor(key) {
      currentColor = colorOf(key);
      colorBtn.style.backgroundColor = COLORS[currentColor];
      for (const b of palette.children) b.setAttribute('aria-checked', String(b.dataset.color === currentColor));
      try { localStorage.setItem('board:color', currentColor); } catch {}
    }
    function togglePalette(open) {
      palette.hidden = !open;
      colorBtn.setAttribute('aria-expanded', String(open));
    }
    for (const [key, hex] of Object.entries(COLORS)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.dataset.color = key;
      b.style.backgroundColor = hex;
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-label', key);
      palette.append(b);
    }
    setColor(currentColor);
    colorBtn.addEventListener('click', () => togglePalette(palette.hidden));
    palette.addEventListener('click', (e) => {
      const b = e.target.closest('.swatch');
      if (!b) return;
      setColor(b.dataset.color);
      togglePalette(false);
      text.focus();
    });
    document.addEventListener('click', (e) => {
      if (!palette.hidden && !e.target.closest('#palette, #colorBtn')) togglePalette(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !palette.hidden) togglePalette(false);
    });

    // ── 입력창 자동 높이 조절 (최대 4줄까지 확장, Enter로 전송 / Shift+Enter로 줄바꿈) ──
    function resizeComposerText() {
      text.style.height = 'auto';
      const maxH = 108; // 4줄 높이 (줄높이 약 21.75px * 4 + 상하 패딩 20px)
      const nextH = Math.max(42, Math.min(text.scrollHeight, maxH));
      text.style.height = `${nextH}px`;
      text.style.overflowY = text.scrollHeight > maxH ? 'auto' : 'hidden';
    }
    text.addEventListener('input', resizeComposerText);
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // ── 전송: 낙관적 업데이트 (암호는 서버에서 해시 저장) ──
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = text.value.trim();
      const pw = pwInput.value;
      if (!content) return;
      if (pw.length < 4) { pwInput.reportValidity(); return; }

      const msg = { id: uuid(), content, created_at: new Date().toISOString(), reactions: {}, color: currentColor };
      addMessage(msg, true); // 즉시 상단 좌측에 표시
      text.value = '';
      resizeComposerText();
      if (sortMode === 'latest') board.scrollTop = 0;

      try {
        const row = await api.post(msg, pw);
        const item = messages.get(msg.id);
        if (item) item.pending = false;
        upsertRow(row);
      } catch (err) {
        removeMessage(msg.id); // 실패 시 롤백하고 입력 내용 복원
        if (!text.value) {
          text.value = content;
          resizeComposerText();
        }
        console.error('[board] 전송 실패', err);
      }
    });

    // ── 상단 가장 우측 아이콘 + 드롭다운 메뉴 (응원 보드 / 실시간 채팅 / 모의 타이머) ──
    const chatPage = $('chatPage'), timerPage = $('timerPage');
    const searchLabelWrap = $('searchLabelWrap'), pageHeading = $('pageHeading'), boardTools = $('boardTools');
    const menuWrap = $('menuWrap'), menuBtn = $('menuBtn'), menuDropdown = $('menuDropdown');
    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let currentPage = 'board';

    function toggleMenu(open) {
      const next = typeof open === 'boolean' ? open : menuDropdown.hidden;
      menuDropdown.hidden = !next;
      menuBtn.setAttribute('aria-expanded', String(next));
    }

    function switchPage(page) {
      if (!['board', 'chat', 'timer'].includes(page)) page = 'board';
      if (capturing && page !== 'board') setCaptureMode(false);
      currentPage = page;

      for (const item of menuItems) {
        item.setAttribute('aria-checked', String(item.dataset.page === page));
      }
      toggleMenu(false);

      const isBoard = page === 'board';
      board.hidden = !isBoard;
      scale.hidden = !isBoard;
      form.hidden = !isBoard;
      searchLabelWrap.hidden = !isBoard;
      boardTools.hidden = !isBoard;

      chatPage.hidden = page !== 'chat';
      timerPage.hidden = page !== 'timer';

      if (isBoard) {
        pageHeading.hidden = true;
        scheduleLayout();
      } else {
        pageHeading.hidden = false;
        pageHeading.textContent = page === 'chat' ? '실시간 채팅' : '모의 시험 시간 타이머';
      }
    }

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });
    menuItems.forEach((item) => {
      item.addEventListener('click', () => switchPage(item.dataset.page));
    });
    document.addEventListener('click', (e) => {
      if (!menuDropdown.hidden && !menuWrap.contains(e.target)) toggleMenu(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menuDropdown.hidden) toggleMenu(false);
    });

    // ── 1. (수능시험) 영역별 실시간 익명채팅방 (22개 채널, 정원 제한 및 인원 표기) ──
    const CHAT_ROOMS = [
      { id: 'all', name: '전체 채팅방', max: 1000 },
      { id: 'kor', name: '국어영역 채팅방', max: 100 },
      { id: 'math', name: '수학영역 채팅방', max: 100 },
      { id: 'eng', name: '영어영역 채팅방', max: 100 },
      { id: 'hist', name: '한국사 채팅방', max: 100 },
      { id: 'eth-life', name: '생활과 윤리 채팅방', max: 100 },
      { id: 'eth-thought', name: '윤리와 사상 채팅방', max: 100 },
      { id: 'geo-kor', name: '한국지리 채팅방', max: 100 },
      { id: 'geo-world', name: '세계지리 채팅방', max: 100 },
      { id: 'hist-ea', name: '동아시아사 채팅방', max: 100 },
      { id: 'hist-world', name: '세계사 채팅방', max: 100 },
      { id: 'pol-law', name: '정치와 법 채팅방', max: 100 },
      { id: 'econ', name: '경제 채팅방', max: 100 },
      { id: 'soc-cul', name: '사회 문화 채팅방', max: 100 },
      { id: 'phy1', name: '물리1 채팅방', max: 100 },
      { id: 'chem1', name: '화학1 채팅방', max: 100 },
      { id: 'bio1', name: '생명1 채팅방', max: 100 },
      { id: 'earth1', name: '지구1 채팅방', max: 100 },
      { id: 'phy2', name: '물리2 채팅방', max: 100 },
      { id: 'chem2', name: '화학2 채팅방', max: 100 },
      { id: 'bio2', name: '생명2 채팅방', max: 100 },
      { id: 'earth2', name: '지구2 채팅방', max: 100 },
    ];

    const CHAT_STORE_KEY = 'board:subjectChats:v2';
    const CHAT_NICK_KEY = 'board:chatNick';
    const CHAT_PEERS_KEY = 'board:chatPeers';
    const roomListEl = $('roomList');
    const chatRoomTitle = $('chatRoomTitle');
    const chatRoomCount = $('chatRoomCount');
    const chatMyNick = $('chatMyNick');
    const chatLog = $('chatLog');
    const chatForm = $('chatForm');
    const chatInput = $('chatInput');

    const myClientId = uuid();
    let myNick = '';
    try { myNick = localStorage.getItem(CHAT_NICK_KEY) || ''; } catch {}
    if (!myNick) {
      myNick = `수험생#${Math.floor(100 + Math.random() * 900)}`;
      try { localStorage.setItem(CHAT_NICK_KEY, myNick); } catch {}
    }
    chatMyNick.textContent = `내 익명 이름: ${myNick}`;

    let currentRoomId = 'all';
    const chatMessagesByRoom = new Map();
    const roomCounts = new Map();

    // 이전 버전 기본 채팅 캐시 정리 후 저장된 채팅 기록 불러오기 (기본 채팅 없음)
    try { localStorage.removeItem('board:subjectChats:v1'); } catch {}
    let savedChatObj = {};
    try { savedChatObj = JSON.parse(localStorage.getItem(CHAT_STORE_KEY) || '{}') || {}; } catch {}
    for (const r of CHAT_ROOMS) {
      const list = Array.isArray(savedChatObj[r.id])
        ? savedChatObj[r.id].filter((m) => m && !String(m.id || '').startsWith('chat-seed-'))
        : [];
      chatMessagesByRoom.set(r.id, list);
      roomCounts.set(r.id, r.id === 'all' ? 1 : 0);
    }

    function saveChatStore() {
      try {
        const out = {};
        for (const [rid, arr] of chatMessagesByRoom) {
          out[rid] = arr.slice(-100);
        }
        localStorage.setItem(CHAT_STORE_KEY, JSON.stringify(out));
      } catch {}
    }

    // 로컬 탭 간 참여 중인 방 현황 동기화 + Supabase 실시간 채널 연동
    function readLocalPeerCounts() {
      const map = new Map();
      for (const r of CHAT_ROOMS) map.set(r.id, 0);
      try {
        const peers = JSON.parse(localStorage.getItem(CHAT_PEERS_KEY) || '{}') || {};
        const now = Date.now();
        let dirty = false;
        for (const [cid, info] of Object.entries(peers)) {
          if (!info || now - info.ts > 15000) {
            delete peers[cid];
            dirty = true;
            continue;
          }
          if (map.has(info.room)) map.set(info.room, map.get(info.room) + 1);
        }
        if (dirty) localStorage.setItem(CHAT_PEERS_KEY, JSON.stringify(peers));
      } catch {}
      return map;
    }

    function heartbeatLocalPeer() {
      try {
        const peers = JSON.parse(localStorage.getItem(CHAT_PEERS_KEY) || '{}') || {};
        peers[myClientId] = { room: currentRoomId, ts: Date.now() };
        localStorage.setItem(CHAT_PEERS_KEY, JSON.stringify(peers));
      } catch {}
      refreshRoomCounts();
    }

    function refreshRoomCounts() {
      const peerMap = readLocalPeerCounts();
      if (channel && typeof channel.presenceState === 'function') {
        const st = channel.presenceState() || {};
        const supMap = new Map();
        for (const r of CHAT_ROOMS) supMap.set(r.id, 0);
        for (const metas of Object.values(st)) {
          const rm = (Array.isArray(metas) && metas[0]?.chatRoom) || 'all';
          if (supMap.has(rm)) supMap.set(rm, supMap.get(rm) + 1);
        }
        for (const r of CHAT_ROOMS) {
          peerMap.set(r.id, Math.max(peerMap.get(r.id) || 0, supMap.get(r.id) || 0));
        }
      }
      for (const r of CHAT_ROOMS) {
        const count = Math.min(r.max, peerMap.get(r.id) || (r.id === currentRoomId ? 1 : 0));
        roomCounts.set(r.id, count);
      }
      renderRoomList();
      updateChatHeader();
    }

    function getRoomMeta(roomId) {
      return CHAT_ROOMS.find((r) => r.id === roomId) || CHAT_ROOMS[0];
    }

    function renderRoomList() {
      if (!roomListEl.children.length) {
        for (const r of CHAT_ROOMS) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'room-item';
          btn.dataset.room = r.id;
          btn.setAttribute('role', 'option');
          const nameSpan = document.createElement('span');
          nameSpan.textContent = r.name;
          const capSpan = document.createElement('span');
          capSpan.className = 'room-cap';
          btn.append(nameSpan, capSpan);
          roomListEl.append(btn);
        }
      }
      for (const btn of roomListEl.children) {
        const rid = btn.dataset.room;
        const meta = getRoomMeta(rid);
        const cnt = roomCounts.get(rid) || 0;
        const selected = rid === currentRoomId;
        btn.setAttribute('aria-selected', String(selected));
        const capSpan = btn.querySelector('.room-cap');
        capSpan.textContent = `${cnt.toLocaleString('ko-KR')} / ${meta.max.toLocaleString('ko-KR')}명`;
        capSpan.classList.toggle('full', cnt >= meta.max);
      }
    }

    function updateChatHeader() {
      const meta = getRoomMeta(currentRoomId);
      const cnt = roomCounts.get(currentRoomId) || 1;
      chatRoomTitle.textContent = meta.name;
      chatRoomCount.textContent = `참여 ${cnt.toLocaleString('ko-KR')} / ${meta.max.toLocaleString('ko-KR')}명`;
    }

    function renderChatMessages() {
      const meta = getRoomMeta(currentRoomId);
      const list = chatMessagesByRoom.get(currentRoomId) || [];
      chatLog.textContent = '';

      const notice = document.createElement('div');
      notice.className = 'chat-notice';
      notice.textContent = `${meta.name}에 입장했습니다. (최대 정원 ${meta.max.toLocaleString('ko-KR')}명 · 클린한 응원 문화를 지켜주세요)`;
      chatLog.append(notice);

      for (const item of list) {
        appendChatBubbleDOM(item);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function appendChatBubbleDOM(item) {
      const row = document.createElement('div');
      const isMine = item.author === myNick || item.mine;
      row.className = `chat-bubble-row${isMine ? ' mine' : ''}`;

      const meta = document.createElement('div');
      meta.className = 'chat-meta';
      const author = document.createElement('span');
      author.className = 'chat-author';
      author.textContent = item.author;
      const time = document.createElement('span');
      time.textContent = formatTime(item.time || new Date().toISOString());
      meta.append(author, time);

      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.textContent = item.text;

      row.append(meta, bubble);
      chatLog.append(row);
    }

    function joinChatRoom(roomId) {
      const meta = getRoomMeta(roomId);
      const currentCnt = roomCounts.get(roomId) || 0;
      if (roomId !== currentRoomId && currentCnt >= meta.max) {
        alert(`${meta.name}의 참여 인원(${meta.max.toLocaleString('ko-KR')}명)이 가득 차 입장할 수 없습니다.`);
        return;
      }
      currentRoomId = meta.id;
      heartbeatLocalPeer();
      if (channel && channel.state === 'joined') {
        try { channel.track({ chatRoom: currentRoomId }); } catch {}
      }
      if (localChannel) {
        localChannel.postMessage({ event: 'chat-presence', payload: { clientId: myClientId, room: currentRoomId } });
      }
      renderRoomList();
      updateChatHeader();
      renderChatMessages();
    }

    roomListEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.room-item');
      if (!btn) return;
      joinChatRoom(btn.dataset.room);
    });

    function receiveChatMessage(roomId, msgObj) {
      if (!chatMessagesByRoom.has(roomId)) return;
      const arr = chatMessagesByRoom.get(roomId);
      if (arr.some((m) => m.id === msgObj.id)) return;
      arr.push(msgObj);
      saveChatStore();
      if (roomId === currentRoomId) {
        appendChatBubbleDOM(msgObj);
        chatLog.scrollTop = chatLog.scrollHeight;
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const txt = chatInput.value.trim();
      if (!txt) return;
      const meta = getRoomMeta(currentRoomId);
      const cnt = roomCounts.get(currentRoomId) || 1;
      if (cnt > meta.max) {
        alert(`${meta.name} 정원(${meta.max}명)을 초과하여 메시지를 보낼 수 없습니다.`);
        return;
      }
      const msgObj = {
        id: uuid(),
        author: myNick,
        text: txt,
        time: new Date().toISOString(),
      };
      chatInput.value = '';
      receiveChatMessage(currentRoomId, msgObj);

      if (channel && channel.state === 'joined') {
        channel.send({ type: 'broadcast', event: 'subject-chat', payload: { roomId: currentRoomId, msg: msgObj } });
      }
      if (localChannel) {
        localChannel.postMessage({ event: 'subject-chat', payload: { roomId: currentRoomId, msg: msgObj } });
      }
    });

    if (localChannel) {
      const prevHandler = localChannel.onmessage;
      localChannel.onmessage = (e) => {
        const ev = e.data?.event;
        const pl = e.data?.payload;
        if (ev === 'subject-chat' && pl) {
          receiveChatMessage(pl.roomId, pl.msg);
          return;
        }
        if (ev === 'chat-presence') {
          refreshRoomCounts();
          return;
        }
        if (prevHandler) prevHandler(e);
      };
    }

    if (channel) {
      channel.on('broadcast', { event: 'subject-chat' }, ({ payload }) => {
        if (payload && payload.roomId && payload.msg) {
          receiveChatMessage(payload.roomId, payload.msg);
        }
      });
    }

    window.addEventListener('beforeunload', () => {
      try {
        const peers = JSON.parse(localStorage.getItem(CHAT_PEERS_KEY) || '{}') || {};
        delete peers[myClientId];
        localStorage.setItem(CHAT_PEERS_KEY, JSON.stringify(peers));
      } catch {}
    });

    heartbeatLocalPeer();
    setInterval(heartbeatLocalPeer, 5000);
    renderChatMessages();

    // ── 2. 모의 시험 시간 타이머 (초 단위 카운트다운 + 시작/멈춤/기록·초기화 + 수능 타종 효과음) ──
    const EXAM_TIMERS = [
      { id: 'kor', name: '국어 영역', minutes: 80 },
      { id: 'math', name: '수학 영역', minutes: 100 },
      { id: 'eng', name: '영어 영역', minutes: 70 },
      { id: 'hist', name: '한국사', minutes: 30 },
      { id: 'inq1', name: '탐구 영역(1)', minutes: 30 },
      { id: 'inq2', name: '탐구 영역(2)', minutes: 30 },
      { id: 'break', name: '쉬는 시간', minutes: 20 },
    ];

    const timerMainCol = $('timerMainCol');
    const timerSideCol = $('timerSideCol');
    const testChimeBtn = $('testChimeBtn');
    const resetAllTimersBtn = $('resetAllTimersBtn');
    const timerStates = new Map();

    // Web Audio API 기반 수능 시험장 타종 차임벨 (외부 오디오 파일 없이 맑은 4음계 종소리 합성)
    let audioCtx = null;
    function playSuneungBell() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // 웨스트민스터/수능 시험장 차임벨 멜로디 (솔4 - 도5 - 레5 - 미5, 잠깐 쉬고 미5 - 레5 - 도5 - 솔4)
        const notes = [
          { freq: 392.00, start: 0.0, dur: 0.55 },
          { freq: 523.25, start: 0.55, dur: 0.55 },
          { freq: 587.33, start: 1.10, dur: 0.55 },
          { freq: 659.25, start: 1.65, dur: 1.15 },
          { freq: 659.25, start: 3.00, dur: 0.55 },
          { freq: 587.33, start: 3.55, dur: 0.55 },
          { freq: 523.25, start: 4.10, dur: 0.55 },
          { freq: 392.00, start: 4.65, dur: 1.40 },
        ];
        const baseTime = audioCtx.currentTime + 0.02;

        for (const n of notes) {
          const osc = audioCtx.createOscillator();
          const overtone = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const overGain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.freq, baseTime + n.start);

          overtone.type = 'triangle';
          overtone.frequency.setValueAtTime(n.freq * 2, baseTime + n.start);

          gain.gain.setValueAtTime(0.0001, baseTime + n.start);
          gain.gain.exponentialRampToValueAtTime(0.26, baseTime + n.start + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, baseTime + n.start + n.dur);

          overGain.gain.setValueAtTime(0.0001, baseTime + n.start);
          overGain.gain.exponentialRampToValueAtTime(0.06, baseTime + n.start + 0.02);
          overGain.gain.exponentialRampToValueAtTime(0.0001, baseTime + n.start + n.dur * 0.65);

          osc.connect(gain);
          overtone.connect(overGain);
          gain.connect(audioCtx.destination);
          overGain.connect(audioCtx.destination);

          osc.start(baseTime + n.start);
          osc.stop(baseTime + n.start + n.dur + 0.05);
          overtone.start(baseTime + n.start);
          overtone.stop(baseTime + n.start + n.dur + 0.05);
        }
      } catch (err) {
        console.error('[timer] 효과음 재생 오류', err);
      }
    }

    function formatTimerSec(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${pad2(m)}:${pad2(sec)}`;
    }

    function updateTimerClockGraphic(st, animateFlip = true) {
      const rem = Math.max(0, Math.floor(st.remainingSec));
      const m = Math.floor(rem / 60);
      const s = rem % 60;

      // 플립 시계 디지털 숫자 업데이트 (3자리 분 지원: 100분 → 1,0,0)
      const mStr = m >= 100 ? String(m).padStart(3, '0') : pad2(m);
      const sStr = pad2(s);
      if (st.minHundredsEl) {
        st.minHundredsEl.hidden = m < 100;
      }
      const nextChars = m >= 100
        ? [mStr[0], mStr[1], mStr[2], sStr[0], sStr[1]]
        : ['0', mStr[0], mStr[1], sStr[0], sStr[1]];

      st.flipDigits.forEach((el, idx) => {
        const ch = nextChars[idx];
        if (el.textContent !== ch) {
          el.textContent = ch;
          if (animateFlip && st.status === 'running') {
            el.classList.remove('flipping');
            void el.offsetWidth;
            el.classList.add('flipping');
          }
        }
      });
    }

    function updateTimerCardUI(st, animateFlip = true) {
      updateTimerClockGraphic(st, animateFlip);
      st.cardEl.classList.toggle('running', st.status === 'running');
      st.cardEl.classList.toggle('finished', st.remainingSec === 0 && st.status !== 'running');

      // 시작 버튼: 동작 중이거나 남은 시간이 0초이면 비활성화
      st.startBtn.disabled = st.status === 'running' || st.remainingSec === 0;
      // 멈춤 버튼: 동작 중일 때만 활성화
      st.pauseBtn.disabled = st.status !== 'running';

      // 기록 / 초기화 버튼 전환:
      // - 동작 중(running): '기록' 버튼으로 동작
      // - 멈춤(paused): '초기화' 버튼으로 변경
      // - 초기 상태(idle): 기록이 남아있으면 '초기화', 아니면 비활성 '기록'
      if (st.status === 'paused') {
        st.actionBtn.textContent = '초기화';
        st.actionBtn.disabled = false;
      } else if (st.status === 'running') {
        st.actionBtn.textContent = '기록';
        st.actionBtn.disabled = false;
      } else {
        st.actionBtn.textContent = st.records.length > 0 ? '초기화' : '기록';
        st.actionBtn.disabled = st.records.length === 0;
      }

      st.recordsEl.hidden = st.records.length === 0;
    }

    function renderTimerRecords(st) {
      st.recordsEl.textContent = '';
      st.records.forEach((rec, i) => {
        const li = document.createElement('li');
        li.className = 'timer-record-item';
        const left = document.createElement('span');
        left.textContent = `#${i + 1} 경과 ${rec.elapsed}`;
        const right = document.createElement('span');
        right.textContent = `남은 시간 ${rec.remaining}`;
        li.append(left, right);
        st.recordsEl.append(li);
      });
      st.recordsEl.scrollTop = st.recordsEl.scrollHeight;
    }

    function startExamTimer(st) {
      if (st.status === 'running' || st.remainingSec <= 0) return;
      // 첫 클릭 시 오디오 컨텍스트 잠금 해제
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx && !audioCtx) audioCtx = new Ctx();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch {}

      st.status = 'running';
      st.deadlineMs = Date.now() + st.remainingSec * 1000;
      clearInterval(st.intervalId);
      st.intervalId = setInterval(() => {
        const leftSec = Math.max(0, Math.ceil((st.deadlineMs - Date.now()) / 1000));
        if (leftSec === st.remainingSec && leftSec > 0) return;
        st.remainingSec = leftSec;
        if (leftSec <= 0) {
          clearInterval(st.intervalId);
          st.intervalId = 0;
          st.status = 'paused'; // 종료 후 멈춤 상태로 전환되어 '초기화' 버튼이 즉시 활성화됨
          updateTimerCardUI(st, true);
          playSuneungBell();
          return;
        }
        updateTimerCardUI(st, true);
      }, 200);
      updateTimerCardUI(st, false);
    }

    function pauseExamTimer(st) {
      if (st.status !== 'running') return;
      clearInterval(st.intervalId);
      st.intervalId = 0;
      st.remainingSec = Math.max(0, Math.ceil((st.deadlineMs - Date.now()) / 1000));
      st.status = 'paused';
      updateTimerCardUI(st, false);
    }

    function recordOrResetExamTimer(st) {
      if (st.status === 'running') {
        const elapsedSec = st.defaultSec - st.remainingSec;
        st.records.push({
          elapsed: formatTimerSec(elapsedSec),
          remaining: formatTimerSec(st.remainingSec),
        });
        renderTimerRecords(st);
        updateTimerCardUI(st, false);
      } else {
        // 멈춤 상태에서 클릭 시 기본 설정 시간으로 초기화
        clearInterval(st.intervalId);
        st.intervalId = 0;
        st.status = 'idle';
        st.remainingSec = st.defaultSec;
        st.records = [];
        renderTimerRecords(st);
        updateTimerCardUI(st, false);
      }
    }

    function createTimerFlipClock() {
      const wrap = document.createElement('div');
      wrap.className = 'timer-flip';

      // 분(minutes) 유닛: 백의 자리(100분 이상일 때만 표시) + 십의 자리 + 일의 자리
      const minUnit = document.createElement('div');
      minUnit.className = 'flip-unit';
      const minPair = document.createElement('div');
      minPair.className = 'flip-pair';
      const mH = document.createElement('span');
      mH.className = 'flip-digit';
      mH.textContent = '1';
      mH.hidden = true;
      const mT = document.createElement('span');
      mT.className = 'flip-digit';
      mT.textContent = '0';
      const mO = document.createElement('span');
      mO.className = 'flip-digit';
      mO.textContent = '0';
      minPair.append(mH, mT, mO);
      const minLbl = document.createElement('span');
      minLbl.className = 'flip-label';
      minLbl.textContent = 'min';
      minUnit.append(minPair, minLbl);

      const sep = document.createElement('span');
      sep.className = 'flip-sep';
      sep.setAttribute('aria-hidden', 'true');

      // 초(seconds) 유닛
      const secUnit = document.createElement('div');
      secUnit.className = 'flip-unit';
      const secPair = document.createElement('div');
      secPair.className = 'flip-pair';
      const sT = document.createElement('span');
      sT.className = 'flip-digit';
      sT.textContent = '0';
      const sO = document.createElement('span');
      sO.className = 'flip-digit';
      sO.textContent = '0';
      secPair.append(sT, sO);
      const secLbl = document.createElement('span');
      secLbl.className = 'flip-label';
      secLbl.textContent = 'sec';
      secUnit.append(secPair, secLbl);

      wrap.append(minUnit, sep, secUnit);
      return {
        wrap,
        minHundredsEl: mH,
        flipDigits: [mH, mT, mO, sT, sO],
      };
    }

    for (const def of EXAM_TIMERS) {
      const defaultSec = def.minutes * 60;
      const isBreak = def.id === 'break';
      const card = document.createElement('article');
      card.className = isBreak ? 'timer-card break-card' : 'timer-card';

      const head = document.createElement('div');
      head.className = 'timer-card-head';
      const title = document.createElement('h3');
      title.className = 'timer-name';
      title.textContent = def.name;
      const badge = document.createElement('span');
      badge.className = 'timer-default-badge';
      badge.textContent = `기본 ${def.minutes}분`;
      head.append(title, badge);

      const bodyRow = document.createElement('div');
      bodyRow.className = 'timer-body-row';
      const { wrap: flipWrap, minHundredsEl, flipDigits } = createTimerFlipClock();

      const controls = document.createElement('div');
      controls.className = 'timer-controls';
      const startBtn = document.createElement('button');
      startBtn.type = 'button';
      startBtn.className = 'timer-btn start';
      startBtn.textContent = '시작';

      const pauseBtn = document.createElement('button');
      pauseBtn.type = 'button';
      pauseBtn.className = 'timer-btn pause';
      pauseBtn.textContent = '멈춤';
      pauseBtn.disabled = true;

      const actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'timer-btn';
      actionBtn.textContent = '기록';
      actionBtn.disabled = true;

      controls.append(startBtn, pauseBtn, actionBtn);
      bodyRow.append(flipWrap, controls);

      const recordsEl = document.createElement('ul');
      recordsEl.className = 'timer-records';
      recordsEl.hidden = true;

      card.append(head, bodyRow, recordsEl);
      if (isBreak) timerSideCol.append(card);
      else timerMainCol.append(card);

      const st = {
        id: def.id,
        name: def.name,
        defaultSec,
        remainingSec: defaultSec,
        status: 'idle',
        deadlineMs: 0,
        intervalId: 0,
        records: [],
        cardEl: card,
        minHundredsEl,
        flipDigits,
        startBtn,
        pauseBtn,
        actionBtn,
        recordsEl,
      };
      timerStates.set(def.id, st);
      updateTimerCardUI(st, false);

      startBtn.addEventListener('click', () => startExamTimer(st));
      pauseBtn.addEventListener('click', () => pauseExamTimer(st));
      actionBtn.addEventListener('click', () => recordOrResetExamTimer(st));
    }

    testChimeBtn.addEventListener('click', playSuneungBell);
    resetAllTimersBtn.addEventListener('click', () => {
      for (const st of timerStates.values()) {
        clearInterval(st.intervalId);
        st.intervalId = 0;
        st.status = 'idle';
        st.remainingSec = st.defaultSec;
        st.records = [];
        renderTimerRecords(st);
        updateTimerCardUI(st, false);
      }
    });
  </script>
</body>
</html>
